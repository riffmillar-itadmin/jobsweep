# Runs the filter regression suite under Windows PowerShell 5.1 AND
# PowerShell 7 -- the same check as `.\Test-JobSweepFilters.ps1 -BothEditions`
# before a commit, but on every change, so nobody has to remember.
#
# No network, no secrets, no output files: the suite tests the shipped
# targeting profile plus the EXAMPLE geography, never anyone's local profile.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A test job never writes to the repository.
permissions:
  contents: read

# A newer push to the same branch cancels a run still in progress.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filters:
    name: Filter suite (5.1 and 7)
    # Windows runners ship both powershell.exe 5.1 and pwsh 7.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Run Test-JobSweepFilters.ps1 -BothEditions
        shell: pwsh
        run: ./Test-JobSweepFilters.ps1 -BothEditions

  lint:
    name: PSScriptAnalyzer (${{ matrix.shell }})
    # A separate job, so a lint failure never hides a test result or the reverse.
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false            # let both editions report, even if one fails
      matrix:
        shell: [powershell, pwsh] # Windows PowerShell 5.1 and PowerShell 7
    steps:
      - uses: actions/checkout@v7

      # The step's shell can't come from the matrix, so the matrix picks the
      # executable instead. The same script is what you run locally.
      - name: Lint with PSScriptAnalyzer (fails on errors and warnings)
        shell: cmd
        run: ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File .\Test-JobSweepLint.ps1
